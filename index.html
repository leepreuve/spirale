<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spirale — analyse de vol</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20261110114426">
  <script src="acces.js?v=20261110114426"></script>
</head>
<body>
  <header class="barre">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <path d="M16 16m-2 0a2 2 0 1 0 4 0a4 4 0 1 0-8 0a6 6 0 1 0 12 0a8 8 0 1 0-16 0a10 10 0 1 0 20 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="logo-nom">Spirale</span>
    </div>
    <nav class="onglets" aria-label="Sections">
      <a href="index.html" class="actif" aria-current="page">Analyse</a>
      <a href="preparation.html">Préparation <span class="pastille" data-version-court>V</span></a>
    </nav>
    <div id="entete-vol" class="entete-vol"></div>
    <div id="selecteurs" class="selecteurs" hidden>
      <select id="choix-a" aria-label="Vol affiché"></select>
      <select id="choix-b" aria-label="Duel contre"></select>
      <label class="btn">Ajouter des vols…
        <input type="file" id="fichiers" accept=".igc,.IGC" multiple hidden>
      </label>
    </div>
  </header>

  <!-- Accueil -->
  <main id="accueil" class="accueil">
    <div id="zone-depot" class="depot">
      <svg class="depot-icone" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 30V10m0 0-7 7m7-7 7 7M10 30v6a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Déposez vos fichiers IGC</h1>
      <p>Un vol pour l'analyser, deux vols ou plus pour les comparer en duel sur la même épreuve.
        Tout se passe dans votre navigateur : les fichiers ne sont envoyés nulle part.</p>
      <div class="boutons">
        <label class="btn principal">Choisir des fichiers
          <input type="file" id="fichiers-accueil" accept=".igc,.IGC" multiple hidden>
        </label>
        <button id="btn-demo" class="btn">Voir un duel de démo</button>
      </div>
      <p class="version" data-version></p>
    </div>
  </main>

  <!-- Espace d'analyse -->
  <main id="espace" class="espace" hidden>
    <section class="zone-carte">
      <div id="carte"></div>

      <div class="ctrl haut-gauche">
        <div class="segment" role="group" aria-label="Trace affichée">
          <button data-filtre="tout" class="actif">Tout</button>
          <button data-filtre="T">Montées</button>
          <button data-filtre="G">Transitions</button>
        </div>
        <div class="segment bascules" role="group" aria-label="Étiquettes sur la carte">
          <button data-etiquette="circuit" class="actif" aria-pressed="true">Circuit</button>
          <button data-etiquette="montees" class="actif" aria-pressed="true">Montées</button>
          <button data-etiquette="transitions" class="actif" aria-pressed="true">Transitions</button>
        </div>
      </div>

      <div class="ctrl haut-droite">
        <div class="etapes">
          <button id="etape-prec" aria-label="Étape précédente">◀</button>
          <span id="etape-nom">Vue d'ensemble</span>
          <button id="etape-suiv" aria-label="Étape suivante">▶</button>
        </div>
        <label class="suivre"><input type="checkbox" id="suivre"> Suivre le planeur</label>
      </div>

      <div id="legende" class="ctrl bas-gauche legende"></div>
    </section>

    <section class="frise">
      <button id="lecture" class="lecture" aria-label="Lire le vol">▶</button>
      <div class="segment vitesses" role="group" aria-label="Vitesse de lecture">
        <button data-vitesse="30" class="actif">×30</button>
        <button data-vitesse="120">×120</button>
      </div>
      <div class="baro"><canvas id="barogramme"></canvas></div>
      <div class="frise-droite">
        <div id="direct" class="direct"></div>
        <div class="largage">
          <button id="fixer-largage" class="btn petit">Fixer le largage ici</button>
          <button id="largage-auto" class="btn petit">Auto</button>
        </div>
      </div>
    </section>

    <aside id="lateral" class="lateral"></aside>
  </main>

  <div id="voile-depot" class="voile-depot" hidden><div>Lâchez les fichiers IGC</div></div>
  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="version.js?v=20261110114426"></script>
  <script src="analyse.js?v=20261110114426"></script>
  <script src="app.js?v=20261110114426"></script>
</body>
</html>
